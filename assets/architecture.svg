<!-- 作者 shingja · github.com/shingja/ustb-steam-ipv6-accelerator · PolyForm Noncommercial 1.0.0 · 保留版权标识⁠​‌‌‌​​‌‌​‌‌​‌​​​​‌‌​‌​​‌​‌‌​‌‌‌​​‌‌​​‌‌‌​‌‌​‌​‌​​‌‌​​​​‌​​‌​‌‌‌‌​‌‌‌​‌​‌​‌‌‌​​‌‌​‌‌‌​‌​​​‌‌​​​‌​​​‌​‌‌​‌​‌‌‌​​‌‌​‌‌‌​‌​​​‌‌​​‌​‌​‌‌​​​​‌​‌‌​‌‌​‌​​‌​‌‌​‌​‌‌​‌​​‌​‌‌‌​​​​​‌‌‌​‌‌​​​‌‌​‌‌​​​‌​‌‌​‌​‌‌​​​​‌​‌‌​​​‌‌​‌‌​​​‌‌​‌‌​​‌​‌​‌‌​‌‌​​​‌‌​​‌​‌​‌‌‌​​‌​​‌‌​​​​‌​‌‌‌​‌​​​‌‌​‌‌‌‌​‌‌‌​​‌​​​‌​‌‌‌‌​​‌‌​​‌​​​‌‌​​​​​​‌‌​​‌​​​‌‌​‌‌​​​‌​‌‌‌‌​‌‌‌​‌‌​​​‌‌​​‌​⁠ -->

<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-label="本机回环转发原理图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141028"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowPink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#ff6b9d"/>
    </marker>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1100" height="520" fill="url(#bg)"/>
  <rect width="1100" height="520" fill="url(#grid)"/>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif">
    <text x="48" y="54" fill="#f8fafc" font-size="24" font-weight="700">本机回环转发：Steam 看到 IPv4，数据走 IPv6</text>
    <text x="48" y="82" fill="#94a3b8" font-size="14">hosts 只负责把 CDN 域名指到 127.0.0.x；真正的 IPv6 连接由本工具建立。</text>
  </g>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif">
    <rect x="48" y="130" width="230" height="120" rx="14" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.55"/>
    <text x="163" y="172" text-anchor="middle" fill="#a5f3fc" font-size="18" font-weight="700">Steam 客户端</text>
    <text x="163" y="200" text-anchor="middle" fill="#cbd5e1" font-size="13">下载器 / content_log</text>
    <text x="163" y="224" text-anchor="middle" fill="#94a3b8" font-size="12">认为自己在连本地 IPv4</text>

    <rect x="400" y="130" width="270" height="120" rx="14" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.6"/>
    <text x="535" y="166" text-anchor="middle" fill="#ddd6fe" font-size="18" font-weight="700">本机转发器</text>
    <text x="535" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">监听 127.0.0.20:80</text>
    <text x="535" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">只绑回环，不对 LAN 开放</text>
    <text x="535" y="240" text-anchor="middle" fill="#94a3b8" font-size="12">失败返回 502，让 Steam 换源</text>

    <rect x="800" y="130" width="250" height="120" rx="14" fill="#111a30" stroke="#ff6b9d" stroke-opacity="0.6"/>
    <text x="925" y="166" text-anchor="middle" fill="#fecdd3" font-size="18" font-weight="700">Steam CDN 节点</text>
    <text x="925" y="194" text-anchor="middle" fill="#cbd5e1" font-size="13">IPv6 / HTTP 80</text>
    <text x="925" y="218" text-anchor="middle" fill="#94a3b8" font-size="12">xz.pphimalayanrt.com 等</text>
    <text x="925" y="240" text-anchor="middle" fill="#94a3b8" font-size="12">含 302 跳转二级域名</text>
  </g>

  <g stroke="#22d3ee" stroke-width="2.5" fill="none" marker-end="url(#arrow)">
    <path d="M278 190 L392 190"/>
  </g>
  <text x="335" y="176" text-anchor="middle" fill="#67e8f9" font-size="12" font-family="Consolas,monospace">HTTP / IPv4</text>
  <text x="335" y="214" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="'Microsoft YaHei',sans-serif">127.0.0.20:80</text>

  <g stroke="#ff6b9d" stroke-width="2.5" fill="none" marker-end="url(#arrowPink)">
    <path d="M670 190 L792 190"/>
  </g>
  <text x="731" y="176" text-anchor="middle" fill="#fda4af" font-size="12" font-family="Consolas,monospace">TCP / IPv6</text>
  <text x="731" y="214" text-anchor="middle" fill="#94a3b8" font-size="11" font-family="'Microsoft YaHei',sans-serif">2001:da8:...</text>

  <g font-family="'Microsoft YaHei','Noto Sans SC',sans-serif">
    <rect x="48" y="320" width="1002" height="150" rx="14" fill="#0e1526" stroke="#ffffff" stroke-opacity="0.1"/>
    <text x="76" y="356" fill="#e2e8f0" font-size="16" font-weight="700">hosts 只增加这一段（退出时删除）</text>
    <text x="76" y="390" fill="#67e8f9" font-size="13" font-family="Consolas,monospace"># ===== SteamIPv6-Download BEGIN (auto) =====</text>
    <text x="76" y="416" fill="#cbd5e1" font-size="13" font-family="Consolas,monospace">127.0.0.20  xz.pphimalayanrt.com</text>
    <text x="76" y="442" fill="#cbd5e1" font-size="13" font-family="Consolas,monospace">127.0.0.21  dl.steam.clngaa.com</text>
    <text x="76" y="468" fill="#67e8f9" font-size="13" font-family="Consolas,monospace"># ===== SteamIPv6-Download END (auto) =====</text>

    <rect x="760" y="338" width="260" height="44" rx="10" fill="#22d3ee" fill-opacity="0.1" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="890" y="365" text-anchor="middle" fill="#a5f3fc" font-size="13">系统代理必须关闭</text>
    <rect x="760" y="396" width="260" height="44" rx="10" fill="#ff6b9d" fill-opacity="0.1" stroke="#ff6b9d" stroke-opacity="0.35"/>
    <text x="890" y="423" text-anchor="middle" fill="#fecdd3" font-size="13">异常退出：还原hosts.bat</text>
  </g>
</svg>
